name: ariadne-cms

services:
  postgres:
    image: postgres:14-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: ariadne_cms
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro

volumes:
  postgres-data:
