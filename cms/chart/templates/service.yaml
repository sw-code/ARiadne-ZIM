apiVersion: v1
kind: Service
metadata:
  name: {{ include "ariadne-cms.fullname" . }}
  labels:
    {{- include "ariadne-cms.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ariadne-cms.selectorLabels" . | nindent 4 }}
